name: Publish Flutter APK

on:
  push:
    branches:
      - develop

jobs:
  publish-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Create production .env
        run: |
          cat > .env <<EOF
          BASE_URL=${{ secrets.BASE_URL }}
          OTP_DURATION=60
          GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
          GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          TRANSITION_TIME=400
          CHAT_DEBOUNCE_TIME=4
          CHAT_LOAD_LIMIT=25
          TARGET_BARS=15
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Collect APK Information
        run: |
          VERSION="commonshub-v${GITHUB_RUN_NUMBER}"
          BUILD_DATE=$(TZ='Asia/Ho_Chi_Minh' date '+%d/%m/%Y %H:%M')
          APK_SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          SHA256=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | awk '{print $1}')
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "SHA256=$SHA256" >> $GITHUB_ENV

          echo "COMMIT_MESSAGE<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_MESSAGE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Upload APK
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/app/outputs/flutter-apk/app-release.apk"
          target: "/tmp/commonshub-apk"
          strip_components: 4
          rm: true

      - name: Publish APK
        uses: appleboy/ssh-action@v1.0.3
        env:
          VERSION: ${{ env.VERSION }}
          BUILD_DATE: ${{ env.BUILD_DATE }}
          APK_SIZE: ${{ env.APK_SIZE }}
          SHA256: ${{ env.SHA256 }}
          COMMIT_MESSAGE: ${{ env.COMMIT_MESSAGE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: VERSION,BUILD_DATE,APK_SIZE,SHA256,COMMIT_MESSAGE
          script: |
            set -e

            DOWNLOAD_DIR="${{ secrets.EC2_WEB_DIR }}/download"
            ARCHIVE_DIR="$DOWNLOAD_DIR/archive"

            sudo mkdir -p "$DOWNLOAD_DIR"
            sudo mkdir -p "$ARCHIVE_DIR"

            ARCHIVE_FILE="${VERSION}.apk"

            sudo cp /tmp/commonshub-apk/app-release.apk "$DOWNLOAD_DIR/latest.apk"

            sudo cp /tmp/commonshub-apk/app-release.apk "$ARCHIVE_DIR/$ARCHIVE_FILE"

            echo "$VERSION" | sudo tee "$DOWNLOAD_DIR/latest-version.txt" >/dev/null
            echo "$BUILD_DATE" | sudo tee "$DOWNLOAD_DIR/latest-date.txt" >/dev/null
            echo "$APK_SIZE" | sudo tee "$DOWNLOAD_DIR/latest-size.txt" >/dev/null
            echo "$SHA256" | sudo tee "$DOWNLOAD_DIR/latest-sha256.txt" >/dev/null
            echo "$COMMIT_MESSAGE" | sudo tee "$DOWNLOAD_DIR/latest-description.txt" >/dev/null

            sudo python3 <<EOF
            import json, os

            file = "$DOWNLOAD_DIR/versions.json"

            item = {
                "version":"$VERSION",
                "date":"$BUILD_DATE",
                "size":"$APK_SIZE",
                "file":"archive/$ARCHIVE_FILE",
                "description":"$COMMIT_MESSAGE"
            }

            if os.path.exists(file):
                with open(file,"r") as f:
                    try:
                        data=json.load(f)
                    except:
                        data=[]
            else:
                data=[]

            data=[x for x in data if x["version"]!=item["version"]]

            data.insert(0,item)

            data=data[:10]

            with open(file,"w") as f:
                json.dump(data,f,indent=2)
            EOF

            echo "Setting permissions..."

            sudo chown -R www-data:www-data "$DOWNLOAD_DIR"

            sudo find "$DOWNLOAD_DIR" -type d -exec chmod 755 {} \;

            sudo find "$DOWNLOAD_DIR" -type f -exec chmod 644 {} \;

            echo "APK deployment completed successfully."
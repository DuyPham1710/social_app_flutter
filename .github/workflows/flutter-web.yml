name: Deploy Flutter Web

on:
  push:
    branches:
      - develop

jobs:
  deploy-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true

      - name: Create production .env
        run: |
          cat > .env <<EOF
          BASE_URL=${{ secrets.BASE_URL }}
          OTP_DURATION=60
          GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
          GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          TRANSITION_TIME=400
          CHAT_DEBOUNCE_TIME=4
          CHAT_LOAD_LIMIT=25
          TARGET_BARS=15
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Upload Web
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/web/*"
          target: "/tmp/commonshub-web"
          strip_components: 2
          rm: true

      - name: Deploy Web
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            sudo mkdir -p ${{ secrets.EC2_WEB_DIR }}

            echo "Cleaning old Flutter Web files..."

            sudo find "${{ secrets.EC2_WEB_DIR }}" \
                -mindepth 1 \
                ! -name download \
                ! -path "${{ secrets.EC2_WEB_DIR }}/download*" \
                -exec rm -rf {} +

            sudo cp -r /tmp/commonshub-web/* \
            ${{ secrets.EC2_WEB_DIR }}/

            sudo chown -R www-data:www-data \
            ${{ secrets.EC2_WEB_DIR }}

            sudo find \
            ${{ secrets.EC2_WEB_DIR }} \
            -type d \
            -exec chmod 755 {} \;

            sudo find \
            ${{ secrets.EC2_WEB_DIR }} \
            -type f \
            -exec chmod 644 {} \;

            sudo find ${{ secrets.EC2_WEB_DIR }} -type d -exec chmod 755 {} \;

            sudo find ${{ secrets.EC2_WEB_DIR }} -type f -exec chmod 644 {} \;

            sudo nginx -t

            sudo systemctl reload nginx
  get_it: ^7.6.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  timeago: ^3.7.1
  pinput: ^5.0.1
  retrofit: ^4.7.2
  lottie: ^3.3.1
  pull_to_refresh: ^2.0.0
  photo_view: ^0.15.0
  scrollable_positioned_list: ^0.3.8
